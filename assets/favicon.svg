  <path fill="#A9701A" d="M60 20 C 44 43 79 55 61 72 C 52 81 56 89 60 100 L 94 80 L 94 40 Z"/>
</g>
<polygon points="60,14 101.6,38 101.6,86 60,110 18.4,86 18.4,38"
         fill="none" stroke="#0E2A47" stroke-width="9" stroke-linejoin="round"/>
